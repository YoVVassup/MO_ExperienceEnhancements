; MOExperience config (missing = default value, restart the game after changes) It is not recommended to delete this file
; The game follows the system language automatically; texts live in MOExperienceResources\<locale>.ini

; ==== ESC menu custom pages ====
[EscMenu]
Enable=1		; master switch for the ESC menu, 0 = disable

; ==== Campaign / operations / chat settings ====
[MsgText]
Enable=1		; master switch of this module (0 = hide message texts)
; ---- Campaign box (top-left by default, campaign/chat/system, view history) ----
FontHeight=18	; text height in pixels, 0 = follow the game's bitmap font height
Bold=0			; bold (0 = regular, 1 = bold)
; Font file name (e.g. msyh.ttc); first looks in the game's current folder, then the system fonts folder; if not found, Microsoft YaHei is used;
; Common files: msyh.ttc=Microsoft YaHei, simsun.ttc=SimSun, simhei.ttf=SimHei, simkai.ttf=KaiTi, simfang.ttf=FangSong, simli.ttf=LiSu, simyou.ttf=YouYuan
FontFace=msyh.ttc
MaxLines=8			; number of visible lines
BoardOpacity=60		; background opacity (0 = no background at all)
HoverMinOpacity=5	; minimum opacity while hovering the campaign box/trigger bar, 0~100 (used to find the area, default 5); 0 = keep the fade-out
ExpandDelayMs=300	; hover dwell time in ms before the history expands (default 300, 0 = immediately)
CampBottom=1		; 1 = show at the bottom (bottom edge fixed, text grows upward), 0 = show at the top
CampBottomMargin=150; bottom margin (applies when shown at the bottom; greyed out in the settings page when shown at the top)
CampCentered=1		; 1 = horizontally centered, 0 = left aligned (PosX)
PosX=2				; left margin (no effect when alignment is centered; greyed out in the settings page)
PosY=2				; top margin (applies when shown at the top; when at the bottom use CampBottomMargin instead)
TopGapLines=0		; reserved lines at the top
MaxWidth=550		; box width: integer = pixels, 0 = auto (half screen); decimals 0~1 = fraction of screen width (e.g. 0.5); cap = screen width - 170
CampEnable=1		; master switch of the campaign text box (0 = hide campaign/chat/system messages)
CampAnim=1			; typewriter effect in the campaign box: 1 = character by character (vanilla speed, default), 0 = whole line instantly
CampBarSide=2		; campaign box scrollbar: 0 = hidden, 1 = left, 2 = right

ScrollStep=2	; mouse wheel step (lines) for the campaign box history, the wheel scrolls inside the box; the scrollbar only shows on hover

; ---- Chat text input box ----
ChatEdit=1		; 0 = vanilla (the native input line stays visible), 1 = custom drawn box (native line hidden, default)
ChatBoxSP=1		; also create a chat box in single player (0 = vanilla, no box in SP)
ChatNameSP=0	; show the "Name: " prefix on single-player messages (0 = body text only, default; always shown in multiplayer)
ImeFullscreen=-1	; IME candidate window positioning base: -1 = auto (ask the ddraw wrapper, default), 0 = window client area (windowed), 1 = monitor (fullscreen upscaled)
; Preset texts; they appear in the chat box, up/down arrows cycle through history
QuickText=I'm a newbie, carry me\nNo air, heroes/discs/airfields/transports allowed

; ---- Action and combat hints (operation hints for hotkeys/waypoints + radar events) ----
HintShow=1
HintPosX=17				; left margin
HintBottom=195			; distance from the bottom edge in pixels
HintFontHeight=16		; text height in pixels, 0 = follow the game's bitmap font height
HintBold=0				; bold (0 = regular, 1 = bold)
HintFontFace=simsun.ttc	; hint box font
HintColorFollow=0	; 0 = white text, 1 = follow the player's actual color (vanilla color)
HintMaxLines=8		; max lines visible in the box at once, scroll for more
HintOpMaxLines=4	; how many of those lines may be "operation hints", the rest go to radar events
HintMaxWidth=400	; box width in pixels, 0 = auto
HintOpacity=0		; background opacity 0~100 (0 = no background drawn, text shadow still drawn)
HintBarSide=1		; scrollbar: 0 = hidden, 1 = left, 2 = right
HintTimeoutMul=2	; multiplier for how long operation hints stay (1 = vanilla speed, 2 = twice as long, max 10)
; ---- Radar events (engine RadarEventType 0~16) ----
HintRadarShow=1		; 1 = write radar events into the action and combat hints
HintRadarClick=1	; 1 = the first few characters of a radar event line are clickable, one click jumps the viewport to where the event happened
HintRadarHold=900	; how long combat info stays visible
; ---- Shadow settings (campaign box / hint box) ----
Shadow=1
ShadowDX=1
ShadowDY=1
ShadowSize=1		; shadow thickness (1 = single layer, 2~3 = thicker)
ShadowOpacity=100
; ---- Troubleshooting ----
LogMessages=0	; log every message (0 = off, 1 = on, includes cs/to/sp)
ShowHotZone=0	; green frame on history trigger bars (1 = show, 0 = hide; trigger detection still works when hidden)

; ---- Superweapon countdown panel ----
[SWPanel]
Enable=1			; 1 = hide the vanilla list and redraw the panel, 0 = vanilla list shown as is
Classic=1			; 1 = vanilla style (right aligned + rows hugging the black bars + rows returned to engine positions), 0 = unified panel
FontPx=16			; text height in pixels, 0 = follow the game's bitmap font height
Bold=0				; bold (0 = regular, 1 = bold)
FontFace=simsun.ttc	; font file name (same format as the campaign box FontFace)
Opacity=60			; background opacity 0~100 (0 = no background drawn, text shadow still drawn)
RightMargin=0		; distance from the panel's right edge to the screen's right edge in pixels
BottomMargin=32		; distance from the panel's bottom edge to the screen's bottom edge in pixels
PadX=2				; horizontal padding in pixels (left/right)
PadY=0				; vertical padding in pixels (top/bottom, classic line height = text height + 2*PadY)
Gap=6				; gap in pixels between the name column and the timer column
Shadow=1			; 1 = draw text shadow
ShadowDX=1			; shadow X offset in pixels
ShadowDY=1			; shadow Y offset in pixels
ShadowSize=1		; shadow thickness (1 = single layer, 2~3 = thicker)
ShadowOpacity=100	; shadow opacity 0~100

; ---- Global vector text takeover (briefing/buttons etc.) ----
[VecText]
Enable=1			; only hooks the five text hooks; 0 = vanilla bitmap font, scaling/bottom power etc. unaffected
FontFace=msyh.ttc	; font file name
FontPx=18			; global font size: 0 = auto calibrate (ink matched to vanilla ink, most stable layout); >0 = fixed pixel size
Bold=0				; bold (0 = regular, 1 = bold)
MenuTake=1			; replace menu buttons entirely (disable original glyphs, fully custom ink drawing, does not follow vanilla cells/clipping)
DigitTrack=0		; digit tracking tweak in pixels (negative = tighter, positive = looser, affects only 0-9, range -8~8)
; Credits settings
CreditPx=16			; separate font size for the top bar resource digits (0 = follow global; >0 = override, only swaps ink glyph widths without moving
CreditDY=-1			; vertical offset of the top bar digits (pixels, negative = up, positive = down)
; Power display (bottom power readout)
PowerBottom=1		; master switch of the power display: 1 = on (sidebar lightning + drain/power), 0 = off
PowerX=1			; 0 = centered on the sidebar (default); >0 = absolute x value, inside the sidebar area
PowerPad=32			; distance from the bottom of the screen, in pixels
PowerMode=1			; 0 = drain/power (default); 1 = surplus as a plain number (positive if enough, negative if not)
; Briefing settings
BriefOwn=1			; 1 = lay out and redraw the briefing body ourselves; 0 = hand it all back to the engine
BriefLine=125		; line spacing, percent. 130 = 1.3, 0 = vanilla cell height;
BriefTrack=0		; letter spacing, pixels. Added after the font advance width (standard letter-spacing)
BriefWidth=580		; body box width, pixels, wrapping follows it. 0 = use the engine's 453
BriefAdv=1			; per-character cell width basis. 1 = the font's own advance width, 0 = uniform font size + spacing
BriefMark=1			; 1 = mark the text bounds with a dark grey double frame (2px outside + 1px inside); 0 = don't
ScoreExit=1			; 1 = hang an "Exit game" button on the mission debriefing dialog; 0 = don't
HidePhobosWarn=1	; Phobos version warning (red text, top right): 1 = don't draw the sentence at all (default), 0 = draw it with the vanilla bitmap font (right aligned across the window width, covered by the resource bar when the sidebar is visible);
; ---- Troubleshooting ----
Perf=0			; 1 = log glyph hit/metrics accounting every 2s (VecText), 0 = off
Render=1		; 1 = vector replacement (factory default 0, turn on manually after verification)

; ---- Single-switch collection ----
[Features]
ToolTips=1		; three-line build hints (1 = three lines: time/power cost, 0 = vanilla two lines and this module does not take part in the layout; white background, black text)
WeaponRange=1	; unit attack range (1 = when exactly one unit is selected and Ctrl is held, draw the current weapon's range circles: blue = max / red = min / cyan = anti-air, 0 = off)
WeaponRangeAAZ=0; anti-air circle height (0 = on the ground; non-zero = raised, in leptons, 1 cell = 256; common flight heights 500~650)
Observer=1		; spectator fix (supports single-player spectating, supports showing the AI panel, humans first and AI after)
BuildQueue=1	; build queue (1 = buildings can be queued by clicking, the icon shows the pending count, Shift+left click adds 5 at once; while waiting to be placed the next one waits, construction starts automatically after placing; 0 = vanilla behavior)
AirWay=1		; aircraft waypoints (1 = aircraft may use waypoints, the return turn is vanilla behavior; 0 = vanilla behavior)
; Hotkey-related changes
OrderThrottle=1		; ordering many units, lifts the 128 limit (0 = disabled, same as vanilla; 1 = single player writes directly + multiplayer vanilla (default); 2 = normal orders in multiplayer are also spread over frames, planned orders stay vanilla)
WaypointCap=128		; waypoint cap, single player only (0 = no limit in SP; N>0 = cap N in SP, max 4096; multiplayer uses the vanilla 16/128)
TypeSelect=1		; T key selects all buildings of a type (1 = press T to batch-select same-type buildings, vanilla only expands 1x1 buildings; 0 = vanilla behavior)
MindSelect=Shift+P	; filter mind-controlled units: only mind-controlled units remain at the end (0 = disabled; write a hotkey to enable, syntax in Hotkey.md)
AttackMove=X2		; custom attack-move (equivalent to vanilla Ctrl+Shift+left click; 0 = disabled; write a hotkey to enable, syntax in Hotkey.md)
NoApproach=1		; units that cannot attack the target (e.g. repair drones) no longer rush toward that enemy target (1 = stop in place and ignore the attack order (default); 0 = vanilla behavior)
SingleUnload=1		; unload a single passenger (1 = left click a passenger icon in the bottom-left info panel to unload only that one (default); 0 = clicking the icon does nothing; never enabled in multiplayer)
PaxWaypoint=1		; passenger waypoints (1 = hold Z and click a passenger icon, then while Z is held a left click on the map adds a waypoint for that passenger, release to submit, it follows the path after exiting (default); 0 = disabled)
BeaconInSP=1		; communication beacons in single player (1 = press B to place a beacon in SP too (default); 0 = vanilla, multiplayer only)
BeaconAutoReplace=1	; automatically replace the oldest when full (1 = when the limit is reached, placing another evicts the oldest, works in SP and MP (default); 0 = pressing B does nothing when full, vanilla behavior)
BeaconLimit=24		; total beacon cap in single player (3~24, out-of-range values are clamped to this range, vanilla is 3 per player; SP merges the 8 players' slots into one pool, multiplayer is always 3)
CheerSelected=1		; local cheering, applies only to selected units; with nothing selected it is still everyone; multiplayer is always everyone (default); 0 = vanilla everyone
MCLossMute=1		; mute "unit lost" alerts for mind-controlled units (radar event text/ring + EVA voice): 1 = muted (default), 0 = vanilla; local presentation only, also effective in multiplayer
; ---- Box selection candidate pool expanded from 500 to 4096 ----
SelPoolCap=1		; lifts the inability to select beyond 500 units on screen, provides a query that the MO_AutoLoad plugin 1.7 will query and decide to use. Automatically disabled when Phobos is detected. 0 = disabled (default), 1 = enabled 
AudioCapacity=0		; audio resource pool expansion 1 = voice 16→32, sample cache 1→8MiB, 0 = vanilla 16 channels / 1MiB cache; read at startup, restart the game after changing


; ---- Expel units while placing buildings ----
[PlaceScatter]
Mode=1		; 0 = disabled (vanilla behavior), 1 = expel on click (the ghost doesn't touch units), 2 = auto expel
Interval=30	; Mode=2 rescan interval (game logic frames, 5~300, default 30)
Batch=16	; max move events issued per trigger (1~64, default 16)
Dist=2		; how many cells to push outward after leaving the box (1~4, default 2)

; ==== Building repair simplification ====
[RepairAll]
Mode=1			; 0 disabled, 1 = double-click repair or ctrl+repair, 2 = automatic repair
Interval=30		; scan interval for Mode=2 (game logic frames, 5~600, default 30 ≈ 1 second).
Batch=24		; max repair events queued per logic frame (1~96, default 24). OutList per-frame cap is 128,
DoubleClick=1	; 1 = accept double-click/repeat press (both icon and hotkey), 0 = only Ctrl+repair.
DblMs=400		; max interval between the two clicks (milliseconds, default 400).

; ==== Aggressive mode ====
[Aggressive]
Hotkey=Alt+A	; toggle aggressive mode for selected units; marked units auto-attack enemy targets within the alert range while idle (0 = disabled)
IconOffsetX=9	; horizontal pixel offset of the mark icon relative to the unit center
IconOffsetY=-5	; vertical pixel offset of the mark icon relative to the unit center (negative = up)
Interval=30		; idle scan interval (game logic frames, 1~300, default 15 ≈ 0.5 seconds)
Cooldown=45		; minimum interval between two auto-attacks of the same unit
RangePercent=100; attack radius (the radius is the max of GuardRange and the primary/secondary weapon ranges; 10~400, default 100)
Target=all		; target scope: all = every enemy unit, building = only enemy buildings
SkipTechBuildings=1	; 1 = don't target valuable tech buildings (power plant/oil derrick/bank/hospital/academy etc.), leave them for engineers to capture; 0 = attack them anyway
SkipTechList=CAPOWR,CANRCT,CASLAB,CAAIRP,CATPAD,CAOILD,CAOILDOM,CABANK,CAMACH,CATHOSP,CAFHOSP,CAHOSP,CAEXPS,CAACAD,CAHMCH,CAAERO,CADOCK,CASTRF,CACOMN,CADEFB,CAREFN	; rules section names of the buildings above, comma separated; empty = built-in default list (set SkipTechBuildings to 0 to disable filtering entirely)

; ==== Smart middle mouse settings ====
; Syntax: [modifier+]key, modifiers Ctrl/Alt/Shift/Win can be stacked, case insensitive, separated by + or a space.
; Keys: letters/digits/F1~F24/Space/Tab/Enter/Backspace/Insert/Delete/Home/End/PageUp/PageDown/
; Up/Down/Left/Right/Pause/Num0~Num9/ mouse Middle/LMB/RMB/X1/X2.
; With multiple keys the last one is the primary key and the preceding ones must be held (e.g. Ctrl+Z+Middle); None = disable the feature.
; Quick patrol circle creation
[PatrolCircle] 
Enable=1	; 1 = click builds a square ring, drag builds an expanding rectangular ring, 0 = off
Hotkey=Z+Middle	; patrol circle combo (the last key is the primary one, the preceding ones must be held)
Size=4		; square ring side length (cells, even, default 4, corners = center ± Size/2; drag expansion distance = Size/2)
Commit=1	; 1 = automatically submit the ring for execution after placing (default), 0 = only place the ring without submitting
NodeStep=2	; drag sampling step (cells, Chebyshev distance, 1~8)
LoopClose=3	; if the start/end distance is below this value, treat it as a closed loop and use a curve (cells, 2~16; otherwise rectangular ring/click)
LoopStep=3	; minimum waypoint spacing on a curved closed loop (cells, 2~16; larger = sparser)
; ---- Barracks/War Factory/Shipyard rally points (Z + polyline) ----
[RallyPath]
Enable=1		; 1 = hold Z to record a multi-segment polyline, units leaving the factory follow the polyline, 0 = vanilla single point
MaxNodes=15		; max trailing segments per building (2~16; the first segment is the rally point set by the player, the tail is recorded locally and appended as units leave)
DelayFrames=45	; how many logic frames to wait after leaving before issuing the waypoint
; Supported building IDs (War Factory, Barracks, Shipyard, Cloning Vat);
Types=GAPILE,NAHAND,YABRCK,FABARR,GAWEAP,NAWEAP,YAWEAP,FAWEAP,GAYARD,NAYARD,YAYARD,FAYARD,NACLON,NAFIST

; ---- Middle mouse smart order movement (click adapts / drag scatters) ----
[SmartOrder]
Enable=1		; 1 = bare middle mouse smart order (click: scatter on empty ground/attack enemy/enter vehicle/garrison building, drag: scatter), 0 = off
Hotkey=Middle	; smart order trigger key
NodeStep=2		; drag sampling step (cells, Chebyshev distance, 1~8; sparsely records trajectory nodes, the source of arc slots)

; ---- Middle mouse smart order (sweep blocks along the trajectory to pick targets, order by cursor semantics, release to execute) ----
[SmartArea]
Enable=1	; 1 = middle mouse combo area-adaptive, 0 = off
Hotkey=Shift+Middle	; combo trigger (Shift+Middle; can also be changed to a single key like X1)
Range=3		; sweep block side length (cells, 2~16, default 4; picks targets centered on each trajectory node from near to far; )
SquadSize=4	; how many per target (1~16, default 4; max units ordered to one target, overflow spills to the next, same meaning as fuzzy; garrison splits evenly regardless)

; ---- Quick tree chop ----
[TreeChop]
Enable=1	; 0 = off
Hotkey=Ctrl+Z+Middle	; tree chop combo
Range=6		; scan block side length (cells, 2~16, default 4; mouse inside the block [Range/2][Range/2])
WoodCheck=1	; 1 = only send units whose warhead has Wood=yes; 0 = no filter, everyone joins

; ---- Fuzzy attack ----
[FuzzyAttack]
Enable=1	; 0 = off
Hotkey=Ctrl+Middle	; fuzzy attack combo
Range=4		; scan block side length (cells, 2~16, default 4; ring sweep from near to far)
SquadSize=4	; how many per target (2~16, default 4; if units ≤ this number, all of them focus fire the nearest one)

; ==== Building placement preview (ghost while placing) ====
[PlacementPreview]
Opacity=50		; translucent preview while placing a building 0 = off, 25/50/75/100 from faint to opaque (skipped automatically when Phobos.dll is present; the deploy ghost uses the same level)
; ---- Deploy position preview ----
[DeployPreview]
Enable=1	;0 = off, 1 = hold the middle button to preview the cells a war factory vehicle or deployable building will occupy after deploying, 
AutoDeploy=1	; 1 = auto deploy, 0 = only preview without ordering the vehicle
DeployTimeout=45	; seconds to wait once in position (5~300; gives up on timeout if the path is walled off)

; ==== Superweapon sidebar ====
[SWSidebar]
Enable=1			; master switch 0 = off
ToggleKey=F4		; toggle show/hide. When hidden it is neither drawn nor takes space. Syntax in Hotkey.md
Alpha=75			; sidebar opacity 0~100. Applies to most of what the sidebar draws
DedupDefensePage=1	; deduplicate the vanilla "Defense Support" page. 1 = superweapons already shown in the sidebar no longer repeat on the vanilla page
Gap=1				; gap in pixels between two icons in the same column
ColGap=0			; horizontal gap between the four columns. 0 = flush, the sidebar sits further right and saves space
RightMargin=0		; distance from the sidebar's right edge to the screen's right edge
MaxRows=10			; max icons shown per column. The rest are not shown, a scrollbar appears on the right
FillMode=0			; display mode: 0 = columns by faction (default) 1 = fill mode (sorting ignores faction, columns kept as even as possible: two columns first, then three/four as needed, scrolling only after four). Right-click the show/hide arrow to switch live
FontPx=16			; font size of the charge percentage text
TopMargin=227		; vertical position, 0 ~ 1 ratio, 0.5 = vertically centered, 0.25 = higher up. Greater than 1 = pixels
ScrollStep=1		; how many rows one wheel notch moves
Side=right			; dock side of the panel: right/left. Allies always sit at the screen edge, Foehn always toward the map interior

; ---- Superweapon priority ----
; Negative = hide that superweapon;  0 or omitted = show by default (priority 1000)
; Positive = priority, smaller numbers come first. Full list in 超武列表.md
ForceShieldSpecial=1
IronCurtainSpecial=1

; ==== Sidebar features (drag bar + hide sidebar) ====
[Sidebar]
ScrollEnable=1		; master switch for the scrollbar (default 1). 0 = neither drawn nor hit-tested
HitWidth=14			; active width of the scrollbar (pixels, 6~20): the click/drag hit zone
ShowWidth=6			; visible width of the scrollbar (pixels, 2~20): thumb drawing width, right aligned inside the active zone, clamped to the active width if larger
RightMargin=3		; distance from the scrollbar to the sidebar's right edge (pixels, 0~12)
ThumbColor=0xA5D3FF	; scrollbar thumb color
;Hide sidebar
HideEnable=1	; master switch for hiding the sidebar (default 1). 1 = enable hide sidebar / fullscreen map. 0 = locked to full display (bottom bar zoom still works as usual, F11 does not switch)
Mode=0			; initial state of the hidden sidebar: 0 = full display / 1 = minimap and buttons only / 2 = fullscreen
ExtraH=5		; state 1 shows a few extra pixels beyond "resource bar + minimap + two buttons"
ToggleKey=F11	; three-state toggle hotkey for the hidden sidebar (syntax in Hotkey.md; None = disable)
SkinSide=0		; faction UI skin: 0 = follow the current faction (default) / 1 = Allied / 2 = Soviet / 3 = Epsilon / 4 = Foehn. Local visuals only, each client in multiplayer applies its own

; ==== Picture-in-picture (second camera mini window) ====
[PiP]
Enable=1		; master switch for PiP, 1 = a toggle button appears in the sidebar, the window starts closed, initial view = center of the main view when opened.
; Initial view = center of the main view when opened. Triangle warning icon: auto-follow the latest radar event, mouse: left click operates inside the window. Hold right click inside to drag the window's view
AutoJump=0		; auto-follow the latest radar event (triangle button): 0 = off / 1 = on; when on it jumps to the latest event immediately, then follows new events automatically
Operate=0		; left click operates inside the window (mouse button): 0 = off / 1 = on; when on, left click in the small window can select/issue orders, hold and drag to box select, right click still pans
Follow=1		; small window follow (F key): 1 = on / 0 = off; when the small window is focused, press F to make it follow the current selection, the main window does not move.
; Unlike the engine's built-in follow, once a target is set, changing selection/deselecting/issuing other orders does not break it; it is only cancelled by pressing F again, right-dragging the view inside the window,
; clicking the minimap or clicking a radar event (going to look elsewhere). An amber border means it is following
ButtonPos=8,155, 25,158, 0,160, 0,168	; toggle button positions, in order Allied/Soviet/Epsilon/Foehn X,Y (X relative to the sidebar column's left edge, Y relative to the screen top)
Width=288		; small window display width (pixels, 64~1024)
Height=207		; small window display height (pixels, 48~1024)
Scale=2			; offscreen render scale: 2 = double resolution then 2:1 downsample
Interval=2		; refresh the second camera every N frames (1 = every frame; raise it to save performance)
PadX=2			; right margin of the small window inside the map area (defaults to the top-right corner)
PadY=2			; top margin of the small window inside the map area
Border=1		; draw the small window border (1 pixel): 1 = draw / 0 = don't
PanRate=8		; right-click pan speed inside the window, per-frame advance = distance * this value / 6 screen pixels; larger = faster
PanMax=6		; right-click pan cap inside the window: at most PanMax*PanRate pixels per frame (game cap 8 cells ≈ 240);


; ==== Bottom bar features ====
[BottomBar]
;Zoom scale bar
ScaleEnable=1	; master switch for the zoom scale bar (default 0). 1 = a zoom scale bar appears on the bottom toolbar
Level=4			; starting level. 0=4x 1=3x 2=2x 3=1.5x 4=1x(default) 5=view 1.25x 6=view 1.5x 7=view 2x 8=max (largest or full map)
Len=250			; scale bar length (pixels, 80~2000).
X=40			; right margin, always based on the sidebar being present (= window width - 168)
Y=1				; bottom margin = pixels from the control's bottom edge to the window's bottom edge
FontPx=12		; font size of the level labels 4x / 1x / 0.5x always visible
Void=0x202028	; background color outside the map (the area exposed when the viewport is larger than the whole map), 0xRRGGBB.
LimitFallback=8192	; long-edge pixel cap (default 8192). 0 = no limit; non-zero values below 3820 are raised to 3820; over-limit values are clamped
; Pause feature
PauseEnable=0	; pause/step two buttons: 1 = always visible, 0 = hidden (default); shown automatically for this match after the pause key is pressed once
PauseHotkey=F5	; pause/resume (only works in single-player skirmish/campaign, ignored online; F5 is shared with the multiplayer taunt key, no conflict in SP)
; Grid display feature
GridEnable=0		; master switch for the grid display: 0 = off (default), 1 = on; can be toggled in the ESC menu and written back
GridCullBack=1		; backface culling for the cliff grid: 1 = cliff faces turned away from the camera keep only the top line, 0 = draw everything (wireframe)
GridShowBlocked=1	; grid obstruction hints: 1 = cliffs/walls/ore/impassable/true cliff edges drawn red, blocking-buildings drawn with an X / passable-blocking buildings with an X and an inner frame, 0 = all grey
; Screenshot feature: captures the unscaled raw viewport without any UI
ShotEnable=0		; screenshot key: 1 = show a camera button left of the scale bar on the bottom bar, 0 = hidden (default); output to <game directory>\Screenshots


; ==== Selected unit info panel (bottom left) ====
[UnitPanel]
Enable=1		; master switch. 1 = show the selected info panel in the bottom-left / 0 = don't draw it at all (doesn't even eat clicks)
Margin=0		; pixels the whole block sits from the viewport's left/bottom edge (0 = in the corner; does not cover the bottom bar, overlap with the FPS display is ignored)
FontPx=11		; font size of health/xp/ammo digits (8~16)
FontFace=msyh.ttc	; font file (game directory or system fonts), write the file name
Collapsed=0		; start collapsed (only the single toggle button in the bottom-left remains). 1 = collapsed / 0 = expanded
ActionLines=0	; 1 = force-enable the engine's unit action lines (the vanilla right-click move line) / 0 = don't touch the in-game setting
BtnFold=1		; left button column: collapse key (1 = show, 0 = hide; if all three are hidden the whole column is not drawn and the panel hugs the bottom-left corner)
BtnWasd=1		; left button column: WASD toggle key
BtnFav=1		; left button column: favorite slot button

; ==== Selected unit favorites ====
; Click an empty slot = store the current selection there (whole group); click a used slot = jump the camera to that group,
; Ctrl+left click = overwrite the favorite; long press = clear the slot; right-click any star = cycle the indicator arrow type.
; When a favorite group is off screen, each off-screen member gets an indicator arrow in its color; beyond ArrowLite the whole group becomes semi-transparent, beyond ArrowMax the extras are not drawn.
[Favorite]
Enable=1		; master switch. 0 = no favorite button shown, no stars/arrows drawn
HoldMs=600		; how long a press must be held to count as a long-press clear (milliseconds, 150~3000)
LiftLeptons=150	; how far above the unit center the star is drawn (leptons, 1 cell = 256)
StarLiftPx=25	; extra pixel lift after projection (fine-tunes star height, -200~400)
StarEnable=1	; favorite stars above units (1 = draw, 0 = don't; the favorite button is unaffected)
ArrowMode=edge	; indicator arrows: none = hidden / edge = hug the view edge / center = concentric orbit circles at the screen center (right-click a star to cycle)
ArrowInset=16	; how many pixels the arrow sits from the view edge (both modes)
CenterRadius=36	; innermost orbit radius in center mode (pixels, 8~400)
CenterGap=26	; per-slot outward increment in center mode (pixels, 4~200)
ArrowLite=15	; if a slot has more off-screen arrows than this, the whole group becomes semi-transparent (1~64)
ArrowMax=40		; max arrows drawn per slot, the extras are not drawn (1~64)
ArrowSize=11	; arrow size (pixels, 6~40)
BeaconArrow=1	; draw indicator arrows for off-screen communication beacons, colored by the beacon's owner (1 = on, 0 = off)
GroupMax=64		; max units recorded per slot (cap for whole-group favorites, 1~64)
Color1=0x40E060	; slot 1 green
Color2=0xFFD040	; slot 2 yellow
Color3=0xFF4838	; slot 3 red
Color4=0x40D8F0	; slot 4 cyan

; ==== Multiplayer PVP cheat notice ====
[PvpNotice]
Single=0	; single-player skirmish testing, 0 = don't send, 1 = same as multiplayer, 2 = send only once; this entry does not affect multiplayer
; ==== ESC menu / settings page frame cap ==== ; while the ESC menu is open the engine has no frame rate throttle and spins a full core; when enabled it caps at 60
[FrameCap]
Enable=1	; 0 = off, 1 = on
; ==== Game speed ====
[GameSpeed]
Enable=0		; 0 = off 1 = on
FPS=60			; 5~121, 121 = uncapped
FixEngineFps=0	; fix the statistics frame rate; the counting method differs, enabling aligns the display

; ==== Environment display (lighting / ore / weather) ====
; Long-term entries: lighting fix master switch, color mix ratio, ore lighting, weather draw mode, cloud shadow, cloud shadow style;
[Environment]
; --- Lighting ---
LightFixEnable=1	; 1 = lighting fix, rebuild all cells after a lighting change + recompute lighting from the engine's current values after loading/map change; 0 = all off, vanilla engine;
LightMix=50			; color mix ratio, 0 = no tinting (default skirmish behavior, lighting parameters don't affect units/buildings/player color), 100 = tint fully by lighting parameters, campaign trigger behavior;
; --- Ore lighting ---
OreEnable=1		; 1 = enable the ore lighting factor, 0 = pure vanilla engine;
OreFactor=75	; how much ambient lighting affects ore/gems in percent, 0 = vanilla (fully bright at night, ignores lighting), 100 = fully follow ambient lighting;

; --- Weather ---
; The rain/snow/fire rain/thunder switches only apply to this run; the draw mode and cloud layer mode are long-term settings
;   Density = 1 particle per N square pixels (resolution independent, larger = sparser)
;   Speed = pixels/second on a 60-frame basis, paired parameters written as "min,max" (e.g. 600,1020); a single number is a fixed value
;   Colors accept RRGGBB / #RRGGBB / R,G,B
SpeedScale=100		; uniform multiplier for all particle speeds (%), 100 = configured speed as is
ImageSpeed=100		; playback speed multiplier for image mode (the engine's RAIN/SNOW.SHP) (%), 100 = as is
DrawMode=particle	; image = the engine's RAIN/SNOW.SHP; particle = self-drawn particles (fire rain is always particles).
WeatherLightMix=80	; how much ambient lighting affects rain/snow/fog color (0 = pure white/original color, 100 = fully darkens/tints with the lighting)
CloudMode=1			; cloud layer mode 0 = off 1 = cloud shadow (darkening) 2 = fog (mixed toward the fog color, the fog color takes ambient light)
CloudFogFloor=0		; minimum fog base density% (0~100) 0 = the thinnest areas can be fully transparent
; --- Cloud layers (cloud shadow / fog) ---
; 0 cumulus puffy cumulus 1 big large sparse chunks 2 small fine fragments 3 sheet smooth stratus layer
; 4 overcast cloudy 5 patchy uneven density 6 streak cloud bands 7 cirrus cirrus
CloudOpacity=70		; cloud density 0~255 (shared by darkening/color mixing, 0 = off)
CloudScale=400		; cloud chunk scale (pixels, same on both axes)
CloudStyle=0	; style (name or index both work)

; --- Rain ---
RainDensity=1500		; 1 rain streak per 1100 square pixels (smaller = denser)
RainSpeed=600,1020		; fall speed range (pixels/second), a wider range means more uneven speeds
RainAlpha=150,220		; opacity range 0~255
RainLen=8,20			; trail length range (pixels)
RainWind=25,45			; wind speed range, negative = leftward, a single value = fixed direction
RainSize=1,2			; streak width range 1~4, one roll per drop (drops vary in size)
RainSplash=4,9			; how many splashes per impact (a range like 7,11 is allowed; 0 = none)
RainSplashRate=1000		; impacts per second (0 = derived from the particle count)
RippleSize=5,9			; max ripple radius on landing (pixels, 2~12)
RainColor=206,227,252	; rain streak color

; --- Snow ---
SnowDensity=1500
SnowSpeed=22,67
SnowAlpha=185,255
SnowBigRate=25		; share of large flakes (%), 0 = all small
SnowWind=-5,55			; wind speed range = percent of fall speed (same syntax as RainWind); 0 = no wind, use random jitter
SnowSize=1,1		; flake arm length range 1~4 (large flakes +1, any bigger doesn't look like snow)
SnowSplash=1,3		; snow landing only kicks up powder, no ripples drawn (a range like 1,3 is allowed; 0 = none)
SnowSplashRate=155
SnowPowderLife=30,60		; powder lifetime range (logic frames, 60 = 1 second; the first roll takes the upper half of the range)
SnowColor=246,250,255

; --- Fire rain (always particles) ---
FireDensity=7500		; fire rain is very sparse, not the same order of magnitude as rain/snow
FireSpeed=840,1560
FireAlpha=190,240
FireLen=20,38
FireSize=2,2		; fire head glow radius range (pixels, 1~4)
FireSplash=8		; how many sparks per impact (a range like 6,10 is allowed; 0 = none)
FireSplashRate=112
FireTailSmoke=150	; how much the rear part of the trail merges into the smoke color 0~255
FirePlume=22		; smoke column length above the trail (pixels, 0 = don't draw)
FireHeadColor=255,252,220
FireMidColor=255,196,84
FireEndColor=150,28,10
FireSmoke=20,34		; emit a puff of trail smoke every N logic frames

; --- Smoke (shared by fire rain trail smoke and landing smoke) ---
SmokeLife=30,44		; how long a puff lives (logic frames)
SmokeAlpha=90,140	; smoke opacity 0~255
SmokeRadius=8		; max smoke radius (pixels, 1~8)
SmokeGrow=3,6		; radius increase per logic frame (1/16 pixel)
SmokeLightColor=178,176,172	; smoke color used on light backgrounds
SmokeDarkColor=70,66,62		; smoke color used on dark backgrounds

; --- Thunder and rain sound ---
ThunderFlash=110			; peak full-screen brightening of lightning 0~255 (0 = only draw the arc, no flash)
ThunderBolt=1				; 1 = draw the lightning bolt itself (arc), 0 = only brighten
ThunderColor=176,194,228	; lightning color (additive blend), bluish looks like real lightning
ThunderFrames=300,900		; interval between two lightning strikes (game frames, at 60 fps 300/900 = 5~15 seconds)
ThunderVolume=100			; thunder volume multiplier
ThunderSound=WeatherIntro,WeatherStart,WeatherStrike	; thunder sound candidates, up to 3 comma separated, one is picked at random each time
RainSound=RainLoop			; entry name of the looping rain sound (section name in sound.ini, a wrong name = silence)
RainSoundEnable=1			;1 = play this loop while it rains
RainVolume=100				; rain volume multiplier
SnowSound=_Amb_WindCold		; entry name of the looping wind sound: _Amb_WindCold, _Amb_WindPlains
SnowSoundEnable=1			;1 = play this loop while it snows; the wind entries have a built-in 5~10 second gap, so the first sound comes a few seconds after snow starts
SnowVolume=100				; wind volume multiplier

; ==== Crate type icons ====
[CrateIcon]
Enable=1		; 1 = show the crate type icon;

; ==== Save thumbnails ====
[SaveShot]
Enable=1		; 1 = write <save directory>\Thumbs\<save name>.bmp on save, show two screenshot boxes on the right of the save/load screen;
Width=320		; thumbnail width (pixels, height follows the viewport aspect), 96~640;
PreviewWidth=200	; width of the screenshot column right of the list (pixels, the two boxes stack vertically), 120~420。
EditHook=1		; 1 = take over the save name input box (cursor/selection/Home/End/copy-paste/IME candidate window positioning), 0 = engine native;

[Log]
MaxKB=500		; at startup, if the file exceeds this size (KB) it is cleared once before writing; <=0 = no limit;
LogDetail=0		; 1 = detailed per-character/per-frame log (brief survey/pev packet capture etc.), 0 = key events only
Perf=0			; 0 = off; 1 = full segmented timing accounting (us/frame); 2 = frame rate only (almost zero overhead)
